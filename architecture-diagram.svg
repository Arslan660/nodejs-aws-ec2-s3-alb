<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AWS architecture diagram</title>
<desc>Internet traffic flows through an Application Load Balancer to an EC2 instance running the Node.js app, which connects to an S3 bucket using an attached IAM role. CloudWatch monitors the EC2 instance.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="460" fill="#FFFFFF"/>

<!-- Internet -->
<rect x="270" y="30" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Internet / user</text>
<line x1="340" y1="74" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ALB -->
<rect x="250" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Application load balancer</text>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Routes HTTP:80</text>
<line x1="340" y1="166" x2="340" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- EC2 -->
<rect x="230" y="202" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">EC2 instance</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Node.js app, port 3000</text>

<!-- S3 -->
<line x1="340" y1="258" x2="340" y2="294" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="294" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">S3 bucket</text>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Object storage</text>
<text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">via IAM role</text>

<!-- CloudWatch -->
<line x1="450" y1="230" x2="500" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="202" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="575" y="220" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#412402">CloudWatch</text>
<text x="575" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#633806">Logs and metrics</text>

<!-- IAM role -->
<rect x="30" y="380" width="300" height="60" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="180" y="400" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">IAM role</text>
<text x="180" y="418" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Grants EC2 secure S3 + CloudWatch access</text>
</svg>
